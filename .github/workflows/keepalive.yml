# Free Supabase projects pause after 7 days without activity. This pings the public showcase
# (which queries the database) twice a week. Set the repository variable SITE_URL to your site.
# Note: GitHub disables scheduled workflows after 60 days without repository activity.
name: keepalive
on:
  schedule: [{ cron: "17 6 * * 1,4" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 30 "${{ vars.SITE_URL }}" -o /dev/null
